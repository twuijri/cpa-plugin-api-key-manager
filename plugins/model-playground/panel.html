<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Model Playground</title>
<style>body{font:16px system-ui;background:#161616;color:#eee;max-width:1000px;margin:32px auto;padding:16px}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #555;border-radius:8px;background:#252525;color:inherit}input,textarea{box-sizing:border-box;width:100%}button{cursor:pointer}label{display:block;margin:16px 0 8px}#messages{height:45vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #444;padding:16px;border-radius:8px}.message{padding:12px;border-bottom:1px solid #333}.role{font-weight:bold;color:#a8c7fa}textarea{height:100px;margin-top:12px}#status{min-height:28px;color:#bdd1ff}select{max-width:100%}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}</style>
<h1>Model Playground</h1><p>أدخل مفتاح API للتطبيقات ثم اضغط «تحميل النماذج» واختر النموذج. المفتاح والمحادثة يبقيان في ذاكرة الصفحة حتى إغلاقها أو تحديثها.</p>
<label for="key">مفتاح API للتطبيقات</label><input id="key" type="password" autocomplete="off" placeholder="Client API key" spellcheck="false" dir="ltr">
<div class="controls"><button id="load">تحميل النماذج</button><select id="source" aria-label="مصدر النموذج"><option value="">جميع المصادر</option></select><select id="model" aria-label="النموذج"><option value="">اختر النموذج</option></select><button id="clear">محادثة جديدة</button></div>
<p>المصدر حسب إعداد حسابات البروكسي الحالية. نماذج Gemini Desktop تُعرف من بادئتها المخصصة؛ غيرها يظهر «غير محدد» حتى تأكيد مصدره.</p><p id="status" role="status"></p><div id="messages" aria-live="polite"></div><textarea id="prompt" placeholder="اكتب رسالة" aria-label="الرسالة"></textarea><div class="controls"><button id="send">إرسال</button><button id="stop" disabled>إيقاف</button></div>
<script>
'use strict';
const el=Object.fromEntries(['key','load','source','model','clear','status','messages','prompt','send','stop'].map(id=>[id,document.getElementById(id)]));
// Use the dedicated Desktop namespace; other IDs require an exact verified map.
const modelSources={"gemini-desktop-auto":"Gemini Desktop","claude-opus-4-6-thinking":"Antigravity","claude-sonnet-4-6":"Antigravity","gemini-3.8-flash-high":"Antigravity","gemini-3-flash":"Antigravity","gemini-3.1-flash-image":"Antigravity","gpt-oss-120b-medium":"Antigravity","gemini-3.1-flash-lite":"Antigravity","gemini-3.5-flash-lite":"Antigravity","gpt-6-astra":"Codex","gpt-6-sol":"Codex","gpt-6.1-sol":"Codex","gpt-6-luna":"Codex","gpt-5.6-sol":"Codex","gpt-5.6-terra":"Codex","gpt-5.6-luna":"Codex","codex-auto-review":"Codex","gpt-image-1.5":"Codex","gpt-image-2":"Codex","gpt-image-2.5-flare":"Codex","gpt-image-2.5-sunburst":"Codex","gpt-image-2.5":"Codex"};
let models=[],history=[],controller=null;
function modelSource(id){if(typeof id==='string'&&id.startsWith('gemini-desktop-'))return 'Gemini Desktop';return Object.hasOwn(modelSources,id)?modelSources[id]:'غير محدد';}
function modelLabel(id){return modelSource(id)+' · '+id;}
function renderModels(){const selected=el.model.value;el.model.replaceChildren();for(const m of models){if(el.source.value&&modelSource(m.id)!==el.source.value)continue;const option=document.createElement('option');option.value=m.id;option.textContent=modelLabel(m.id);el.model.append(option);}if(Array.from(el.model.options).some(o=>o.value===selected))el.model.value=selected;}
el.source.onchange=renderModels;
function status(s){el.status.textContent=s;}
function headers(){const key=el.key.value.trim();if(!key)throw Error('أدخل مفتاح API للتطبيقات أولًا');return {'Authorization':'Bearer '+key,'Content-Type':'application/json'};}
function bubble(role,text){const div=document.createElement('div');div.className='message';const name=document.createElement('div');name.className='role';name.textContent=role;const body=document.createElement('div');body.dir='auto';body.textContent=text;div.append(name,body);el.messages.append(div);return body;}
function busy(on){el.send.disabled=on;el.load.disabled=on;el.clear.disabled=on;el.model.disabled=on;el.source.disabled=on;el.key.disabled=on;el.stop.disabled=!on;}
async function check(resp){if(!resp.ok)throw Error('فشل الطلب ('+resp.status+'): '+(await resp.text()).slice(0,500));}
el.load.onclick=async()=>{try{status('جارٍ تحميل النماذج…');const resp=await fetch('/v1/models',{headers:headers(),redirect:'error'});await check(resp);const data=await resp.json();models=(data.data||[]).filter(m=>typeof m.id==='string');el.source.replaceChildren();const all=document.createElement('option');all.value='';all.textContent='جميع المصادر';el.source.append(all);for(const source of [...new Set(models.map(m=>modelSource(m.id)))].sort()){const option=document.createElement('option');option.value=source;option.textContent=source;el.source.append(option);}renderModels();status('تم تحميل '+models.length+' نموذج');}catch(e){status(e.message);}};
el.clear.onclick=()=>{history=[];el.messages.replaceChildren();status('محادثة جديدة');};
el.stop.onclick=()=>controller?.abort();
el.send.onclick=async()=>{const content=el.prompt.value.trim();if(!content)return;let auth;try{auth=headers();if(!el.model.value)throw Error('حمّل النماذج واختر نموذجًا');}catch(e){status(e.message);return;}const messages=[...history,{role:'user',content}];bubble('أنت',content);const output=bubble(modelLabel(el.model.value),'');el.prompt.value='';controller=new AbortController();busy(true);status('جارٍ الرد…');let answer='';let reasoning='';
function render(){output.textContent=(reasoning?'[التفكير]\n'+reasoning+'\n\n':'')+answer;el.messages.scrollTop=el.messages.scrollHeight;}
function event(data){if(data==='[DONE]')return;const obj=JSON.parse(data);if(obj.error)throw Error(obj.error.message||'Model error');const delta=obj.choices?.[0]?.delta||{};if(typeof delta.content==='string')answer+=delta.content;const thought=delta.reasoning_content||delta.reasoning;if(typeof thought==='string')reasoning+=thought;render();}
try{const resp=await fetch('/v1/chat/completions',{method:'POST',headers:auth,redirect:'error',signal:controller.signal,body:JSON.stringify({model:el.model.value,messages,stream:true})});await check(resp);if(!resp.body)throw Error('لا يوجد رد قابل للقراءة');const reader=resp.body.getReader();const decoder=new TextDecoder();let buffer='';for(;;){const {value,done}=await reader.read();buffer+=decoder.decode(value,{stream:!done});let end;while((end=buffer.indexOf('\n'))>=0){const line=buffer.slice(0,end).replace(/\r$/,'');buffer=buffer.slice(end+1);if(line.startsWith('data:'))event(line.slice(5).trimStart());}if(done)break;}if(buffer.startsWith('data:'))event(buffer.slice(5).trim());history=[...messages,{role:'assistant',content:answer}];status('اكتمل الرد');}catch(e){status(e.name==='AbortError'?'تم الإيقاف':e.message);}finally{controller=null;busy(false);}};
</script></html>
